#logging.yaml
version: 1
disable_existing_loggers: false

formatters:
  default:
    format: "[ %(asctime)s ] - %(lineno)d - %(name)s - %(levelname)s - %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"

handlers:
  stream_handler:
    class: logging.StreamHandler
    level: INFO
    formatter: default
    stream: ext://sys.stdout
  file_handler:
    class: logging.FileHandler
    level: INFO
    formatter: default
    enable: false
    log_root_dir: logs
    encoding: utf-8

root:
  level: INFO
  handlers:
    - stream_handler
    - file_handler
